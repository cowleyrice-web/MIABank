<!DOCTYPE html>
<html>
<head>
<title>MIABank</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: Arial; 
    background: linear-gradient(135deg,#FF8C00,#FF4500); /* ORANGE BACKGROUND */
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin:0; 
    padding:20px;
  }
  .box {
    background: white; 
    padding: 30px; 
    border-radius: 15px; 
    width: 90%; 
    max-width: 400px; 
    text-align: center; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .logo {
    font-size: 32px;
    font-weight: bold;
    color: #FF4500;
    margin-bottom: 10px;
  }
  input {
    width: 90%; 
    padding: 12px; 
    margin: 10px 0; 
    border-radius: 8px; 
    border: 2px solid #ddd;
  }
  button {
    width: 95%; 
    padding: 12px; 
    background: #FF4500; /* ORANGE BUTTON */
    color: white; 
    border: none; 
    border-radius: 8px; 
    font-weight: bold; 
    margin: 5px 0; 
    cursor: pointer;
  }
  button:hover {background: #FF8C00;}
  .balance {font-size: 28px; color: #FF4500; font-weight: bold;}
  .info {text-align: left; background: #FFF3E0; padding: 15px; border-radius: 10px; margin: 15px 0;}
  h2 {color: #FF4500;}
</style>
</head>
<body>

<div class="box" id="login">
  <div class="logo">🏦 MIABank</div>
  <h2>Log In</h2>
  <input id="email" type="email" placeholder="cowleyrice@gmail.com">
  <input id="pass" type="password" placeholder="J0987654321@">
  <button onclick="login()">Log In</button>
  <p><a href="#" onclick="showSignup()">Create Account</a></p>
</div>

<div class="box" id="signup" style="display:none;">
  <div class="logo">🏦 MIABank</div>
  <h2>Sign Up</h2>
  <input id="newEmail" type="email" placeholder="Email">
  <input id="newPass" type="password" placeholder="Password">
  <button onclick="signup()">Sign Up - Get $120,000</button>
  <p><a href="#" onclick="showLogin()">Back to Login</a></p>
</div>

<div class="box" id="dashboard" style="display:none;">
  <div class="logo">🏦 MIABank</div>
  <h2 id="welcomeText">Welcome!</h2> 
  <div class="info">
    <p><b>Account:</b> <span id="acc"></span></p>
    <p><b>Routing:</b> <span id="route"></span></p>
    <p><b>Balance:</b> $<span class="balance" id="bal">0</span></p>
  </div>
  <button onclick="showSend()">Send</button>
  <button onclick="showReceive()">Receive</button>
  <button onclick="logout()" style="background:#ccc; color:#333;">Log Out</button>
</div>

<div class="box" id="sendBox" style="display:none;">
  <div class="logo">🏦 MIABank</div>
  <h2>Send Money</h2>
  <input id="sendTo" type="text" placeholder="Recipient Account Number">
  <input id="sendAmount" type="number" placeholder="Amount">
  <button onclick="sendMoney()">Send Now</button>
  <button onclick="showDashboard()" style="background:#ccc; color:#333;">Back</button>
</div>

<div class="box" id="receiveBox" style="display:none;">
  <div class="logo">🏦 MIABank</div>
  <h2>Receive Money</h2>
  <p>Share these details to receive money:</p>
  <div class="info">
    <p><b>Account:</b> <span id="acc2"></span></p>
    <p><b>Routing:</b> <span id="route2"></span></p>
  </div>
  <button onclick="showDashboard()" style="background:#ccc; color:#333;">Back</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCtrzE1qHXdh4lweBw3sE9OJI0UDICz7Ug",
  authDomain: "miabank.firebaseapp.com",
  projectId: "miabank",
  storageBucket: "miabank.firebasestorage.app",
  messagingSenderId: "507511575808",
  appId: "1:507511575808:web:045107c11e58db319c8fe5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUserData = {};

function hideAll(){ 
  document.getElementById('login').style.display = 'none';
  document.getElementById('signup').style.display = 'none';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('sendBox').style.display = 'none';
  document.getElementById('receiveBox').style.display = 'none';
}
function showLogin(){hideAll(); document.getElementById('login').style.display = 'block';}
function showSignup(){hideAll(); document.getElementById('signup').style.display = 'block';}
function showDashboard(){hideAll(); document.getElementById('dashboard').style.display = 'block';}
function showSend(){hideAll(); document.getElementById('sendBox').style.display = 'block';}
function showReceive(){
  hideAll(); 
  document.getElementById('acc2').innerText = currentUserData.accountNumber;
  document.getElementById('route2').innerText = currentUserData.routingNumber;
  document.getElementById('receiveBox').style.display = 'block';
}

window.signup = async () => {
  const email = document.getElementById('newEmail').value;
  const pass = document.getElementById('newPass').value;
  if(!email || !pass) return alert("Fill email and password");
  try {
    const userCred = await createUserWithEmailAndPassword(auth, email, pass);
    const uid = userCred.user.uid;
    
    // YOUR FIXED ACCOUNT DETAILS
    const accNum = "4642 2752 91"; 
    const routingNum = "021000021"; 
    
    await setDoc(doc(db, "users", uid), {
      email: email,
      name: "JAMES COMTES", // THIS MAKES IT SAY WELCOME JAMES COMTES
      balance: 120000,
      accountNumber: accNum,
      routingNumber: routingNum
    });
    alert("Account Created! $120,000 deposited");
    showLogin();
  } catch(e) { alert(e.message); }
}

window.login = async () => {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const uid = cred.user.uid;
    const docSnap = await getDoc(doc(db, "users", uid));
    if (docSnap.exists()) {
      currentUserData = docSnap.data();
      document.getElementById('acc').innerText = currentUserData.accountNumber;
      document.getElementById('route').innerText = currentUserData.routingNumber;
      document.getElementById('bal').innerText = currentUserData.balance.toLocaleString();
      document.getElementById('welcomeText').innerText = "WELCOME " + currentUserData.name; 
      showDashboard();
    } else {
      alert("No account data found. Please sign up first.");
    }
  } catch(e) { alert(e.message); }
}

window.sendMoney = async () => {
  const amount = parseFloat(document.getElementById('sendAmount').value);
  const toAccount = document.getElementById('sendTo').value;
  
  if(!amount || amount <= 0) return alert("Enter valid amount");
  if(amount > currentUserData.balance) return alert("Insufficient Balance");
  
  const newBalance = currentUserData.balance - amount;
  await updateDoc(doc(db, "users", auth.currentUser.uid), {balance: newBalance});
  currentUserData.balance = newBalance;
  document.getElementById('bal').innerText = newBalance.toLocaleString();
  alert(`$${amount} Sent to ${toAccount}`);
  showDashboard();
}

window.logout = async () => {await signOut(auth); showLogin();}
</script>
</body>
</html>
